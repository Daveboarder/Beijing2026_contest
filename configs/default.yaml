# Configuration for the LIBS 2026 steel aging-state classification contest.
# Paths may be absolute or relative to the project root.

paths:
  raw_data: ../../../Data/competition_data_release/competition_data_release
  cache: cache
  results: results
  submissions: submissions

data:
  # The 200 shots are fired into one spot, so shot index is a depth coordinate
  # and their order is meaningful. Never shuffle or drop shots.
  n_shots: 200
  n_wavelengths: 12282
  # Row index where each spectrometer channel starts (last entry = end of array).
  channel_bounds: [0, 4094, 8188, 12282]

features:
  # mean | mean_lines | lines | depth_bins | depth_contrast | depth_profile | mean_depth
  # (see src/libs2026/depth.py). Shot index is a depth coordinate: steel ages
  # from the surface inwards, so the spectrum *changes* from shot 1 to 200.
  # Full-spectrum depth encodings are noise-dominated; mean_lines keeps the
  # average spectrum and appends compact depth curves of diagnostic lines.
  encoding: mean_lines
  n_bins: 8                 # log-spaced depth bins, fine near the surface
  # blocks | interleaved | surface: how the n_groups rows per sample are drawn.
  # "surface" uses only the first half of the depth profile (where classes
  # separate) and avoids labelling deep bulk shots with the aging level.
  # "blocks" over the full 200 shots is still competitive as data augmentation.
  augment: surface

preprocessing:
  # Outlier shots are repaired by interpolation, never deleted: shot index is
  # the depth coordinate, so removing a shot would shift the whole profile.
  repair_outlier_shots: true
  outlier_z: 4.0
  # Outliers are judged against the local depth trend over this many neighbouring
  # shots. A global threshold would flag the whole (informative) surface region.
  outlier_window: 11
  # Trailing fraction of shots treated as unaffected bulk material.
  bulk_fraction: 0.3
  # "bulk" derives one intensity scale per sample from the bulk shots and keeps
  # the depth intensity profile; "shot" rescales every shot and flattens it away.
  # Keep "bulk" when using mean_lines / depth encodings so dip depths stay
  # meaningful. "shot" can still help pure mean-spectrum baselines.
  normalization_reference: bulk
  # Baseline removal is off on purpose: the sweep in
  # results/metrics/preprocessing_sweep_g1_b1.csv shows SNIP costs ~5 accuracy
  # points, i.e. the plasma continuum itself carries aging information.
  baseline: none            # none | snip
  snip_iterations: 40
  normalization: l2         # none | tic | max | snv | l2
  # Wavelength region kept for modelling (nm). null = keep everything.
  wl_min: null
  wl_max: null

cv:
  n_splits: 5
  n_repeats: 4
  random_state: 42

cnn:
  # Wavelength / shot binning for the 2-D CNN image. Defaults yield ~50 x 1533.
  bin_factor: 8
  shot_bin: 4
  # Per-fold spectral PCA width; 0 disables it (not recommended with N=120).
  spectral_pca: 48
  epochs: 180
  batch_size: 16
  lr: 0.001
  dropout: 0.35
  # Compact net; single-seed CV is noisy (~0.43–0.52), 5-seed ensemble ~0.57.
  channels: [32, 64, 128]
  ensemble_seeds: [42, 7, 123, 99, 2026]

# Spectral-line tokenization: each spectrum becomes a sequence of physical
# transitions instead of 12282 wavelength bins (see src/libs2026/tokens.py).
tokens:
  # Line database from the LIBS foundation-model project. These measurements
  # were taken in air, so the air database is required: the vacuum variant is
  # offset by ~0.07-0.12 nm, which is larger than the pixel step and measurably
  # degrades the fits (12.1% valid / 0.119 nm median offset, against
  # 16.8% / 0.047 nm for air under identical settings).
  db_path: /mnt/data/projects/Running_projects/26_0153_Foundation_model/Methods/LIBS_foundation/external_data/Source/LIBS_data.db
  # Steel matrix plus the ambient species always present in a LIBS plasma.
  elements: [Fe, Cr, Ni, Mn, Si, Mo, V, Cu, Ti, Al, C, H, O, N]
  # Saha-Boltzmann grid used to rank lines by theoretical intensity.
  te_range: [6500.0, 11000.0]
  # The +  is required: YAML reads 1.0e17 as a string, 1.0e+17 as a float.
  ne_range: [1.0e+17, 5.0e+17]
  n_te: 10
  n_ne: 10
  # Keep the strongest 10% of each element's lines (all of them below min_keep).
  percent: 10.0
  min_keep: 10
  # Drop lines closer together than this many detector pixels. The raw list is
  # finer than the spectrometer (median spacing 0.10 nm against a 0.08-0.18 nm
  # resolution limit), so without this 65% of tokens share their peak with a
  # neighbour and the static physics channels end up describing the wrong
  # transition. Set to 0 to keep every line.
  min_separation_pixels: 2.0
  # Consecutive shots averaged before fitting; 4 gives 50 depth rows.
  shot_bin: 4
  fit:
    window_nm: 0.3
    gamma_init: 0.1
    sigma_init: 0.006
    # Keep every converged fit and let the r2 channel carry the confidence.
    # The upstream 0.85 gate zeroes ~80% of tokens (20% valid vs 74% at 0.0).
    r2_min: 0.0
    # Skip lines buried in noise: absent transitions carry no information.
    min_snr: 3.0
    maxfev: 600
    # Fitted centroid may not walk more than this many pixels from the
    # theoretical wavelength, otherwise the Voigt claims a neighbouring line.
    max_shift_pixels: 1.5

output:
  submission_name: predictions.csv

# Shared wavelength CNN -> depth encoder -> end-to-end five-class MLP.
# This experiment has its own preprocessing: repaired, shot-L2 spectra plus
# log1p channel intensity relative to the trailing bulk shots; no baseline removal.
depth_transformer:
  bin_factor: 4
  surface_shots: 20
  late_bin: 4
  bulk_start: 140
  epochs: 100
  patience: 15
  batch_size: 8
  lr: 0.0003
  dropout: 0.2
  seeds: [42, 7, 123]

# Transformer autoencoder on the same raw depth sequences: sinusoidal wavelength
# PE, glued CLS representation, MSE reconstruction + MLP with one-hot class targets.
autotransformer:
  # Preparation mirrors depth_transformer (shared prepare_sample / depth windows).
  bin_factor: 4
  surface_shots: 20
  late_bin: 4
  d_model: 64
  n_layers: 2
  n_heads: 4
  ff_dim: 128
  dropout: 0.1
  lambda_recon: 1.0
  epochs: 100
  patience: 15
  batch_size: 8
  lr: 0.0003
  weight_decay: 0.001
  seeds: [42, 7, 123]

# Fuse autoencoder CLS embeddings with PCA(mean_lines) scores, then MLP.
# Classical side uses n_groups=4; each sample CLS is broadcast onto its rows.
# AE prep/hparams fall back to autotransformer when omitted here.
ae_pca_mlp:
  encoding: mean_lines
  n_groups: 4
  classical_bin_factor: 1
  n_pca: 30
  mlp_hidden: [256, 128]
  mlp_alpha: 0.0001
  mlp_max_iter: 2000
  seeds: [42, 7, 123]
